externalDocs:
  description: OpenAPI
  url: https://swagger.io/resources/open-api/
info:
  contact:
    email: dukungan@dengankarya.com
    name: Dengan Karya Support
    url: https://dengankarya.com/contact
  description: This is the API documentation for the Connector service, which handles
    any kind of external integrations for Dengankarya.
  title: Connector API Docs
  version: "1.0"
paths:
  /accounts/balance:
    get:
      description: 'Returns the merchant''s combined balance: shipping wallet (available/on-hold)
        and payment settlement balance (settled/pending/paid-out). Both are computed
        from local DB — no external API call.'
      parameters:
      - description: Tenant ID
        format: int64
        in: header
        name: X-Tenant-ID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Unified balance
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_account.UnifiedBalance'
              type: object
        "400":
          description: Missing X-Tenant-ID
          schema:
            $ref: '#/definitions/common.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/common.Response'
      security:
      - ApiKeyAuth: []
      summary: Get unified balance
      tags:
      - Account
  /accounts/balance/payments:
    get:
      description: Returns transaction-derived settled/pending/paid-out balance. Settled
        = SUM(merchant_amount) where status='settled'; PendingSettlement = status='paid';
        PaidOut = completed payouts. AvailableToPayout = Settled - PaidOut.
      parameters:
      - description: Tenant ID
        format: int64
        in: header
        name: X-Tenant-ID
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Payment settlement balance
          schema:
            allOf:
            - $ref: '#/definitions/common.Response'
            - properties:
                data:
                  $ref: '#/definitions/internal_account.MerchantPaymentBalance'
